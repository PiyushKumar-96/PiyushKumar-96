<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Three cards: The Builder, The Night Owl, The Debugger" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>draw a card</title>
<defs>
  <radialGradient id="ohaze" cx="50%" cy="0%" r="90%">
    <stop offset="0" stop-color="#A78BFA" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="oframe"><rect x="1" y="1" width="998" height="328" rx="18"/></clipPath>
</defs>
<g clip-path="url(#oframe)">
  <rect width="1000" height="330" fill="#0B0714"/>
  <rect width="1000" height="330" fill="url(#ohaze)"/>
  <text x="500" y="26" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="12" letter-spacing="4" fill="#8C82B6">the deck says</text>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0"
      dur="7s" begin="0.0s" repeatCount="indefinite"/>
    <rect x="60" y="40" width="240" height="250" rx="14" fill="#120C22" stroke="#2A2044" stroke-width="1.2"/>
    <rect x="70" y="50" width="220" height="230" rx="9" fill="none" stroke="#A78BFA" stroke-width="0.8" opacity="0.35"/>
    <rect x="60" y="40" width="240" height="250" rx="14" fill="none" stroke="#FFD782" stroke-width="1.6" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="9s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <g transform="translate(180,112)" opacity="0.8">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="5s" repeatCount="indefinite"/>
      <path d="M0,-24 Q3.5,-3.5 24,0 Q3.5,3.5 0,24 Q-3.5,3.5 -24,0 Q-3.5,-3.5 0,-24 Z" fill="#FFD782"/>
    </g>
    <text x="180" y="176" text-anchor="middle" font-size="21" fill="#E8E4FF" font-family="Georgia,DejaVu Serif,serif">The Builder</text>
    <line x1="130" y1="196" x2="230" y2="196" stroke="#A78BFA" stroke-width="0.8" opacity="0.5"/>
    <text x="180" y="222" text-anchor="middle" font-size="12.5" fill="#8C82B6" font-family="Verdana,DejaVu Sans,sans-serif">ships at 2am,</text>
    <text x="180" y="242" text-anchor="middle" font-size="12.5" fill="#8C82B6" font-family="Verdana,DejaVu Sans,sans-serif">documents at 3</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0"
      dur="8s" begin="0.7s" repeatCount="indefinite"/>
    <rect x="360" y="40" width="240" height="250" rx="14" fill="#120C22" stroke="#2A2044" stroke-width="1.2"/>
    <rect x="370" y="50" width="220" height="230" rx="9" fill="none" stroke="#A78BFA" stroke-width="0.8" opacity="0.35"/>
    <rect x="360" y="40" width="240" height="250" rx="14" fill="none" stroke="#FFD782" stroke-width="1.6" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="9s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <g transform="translate(480,112)" opacity="0.8">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="6s" repeatCount="indefinite"/>
      <path d="M2,-21 A21,21 0 1,0 2,21 A26,26 0 1,1 2,-21 Z" fill="#FFD782"/>
    </g>
    <text x="480" y="176" text-anchor="middle" font-size="21" fill="#E8E4FF" font-family="Georgia,DejaVu Serif,serif">The Night Owl</text>
    <line x1="430" y1="196" x2="530" y2="196" stroke="#A78BFA" stroke-width="0.8" opacity="0.5"/>
    <text x="480" y="222" text-anchor="middle" font-size="12.5" fill="#8C82B6" font-family="Verdana,DejaVu Sans,sans-serif">peak focus arrives</text>
    <text x="480" y="242" text-anchor="middle" font-size="12.5" fill="#8C82B6" font-family="Verdana,DejaVu Sans,sans-serif">after midnight</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0"
      dur="9s" begin="1.4s" repeatCount="indefinite"/>
    <rect x="660" y="40" width="240" height="250" rx="14" fill="#120C22" stroke="#2A2044" stroke-width="1.2"/>
    <rect x="670" y="50" width="220" height="230" rx="9" fill="none" stroke="#A78BFA" stroke-width="0.8" opacity="0.35"/>
    <rect x="660" y="40" width="240" height="250" rx="14" fill="none" stroke="#FFD782" stroke-width="1.6" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="9s" begin="6s" repeatCount="indefinite"/>
    </rect>
    <g transform="translate(780,112)" opacity="0.8">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="7s" repeatCount="indefinite"/>
      <path d="M5,-24 L-13,3 L-1,3 L-7,24 L13,-5 L1,-5 Z" fill="#FFD782"/>
    </g>
    <text x="780" y="176" text-anchor="middle" font-size="21" fill="#E8E4FF" font-family="Georgia,DejaVu Serif,serif">The Debugger</text>
    <line x1="730" y1="196" x2="830" y2="196" stroke="#A78BFA" stroke-width="0.8" opacity="0.5"/>
    <text x="780" y="222" text-anchor="middle" font-size="12.5" fill="#8C82B6" font-family="Verdana,DejaVu Sans,sans-serif">argues with rubber ducks,</text>
    <text x="780" y="242" text-anchor="middle" font-size="12.5" fill="#8C82B6" font-family="Verdana,DejaVu Sans,sans-serif">usually loses</text>
  </g>
</g>
<rect x="1" y="1" width="998" height="328" rx="18" fill="none" stroke="#A78BFA" stroke-width="1.1" opacity="0.4"/>
</svg>
