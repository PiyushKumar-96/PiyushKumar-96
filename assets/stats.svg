<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="GitHub statistics for PiyushKumar-96">
<title>GitHub statistics for PiyushKumar-96</title>
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#D8B4FE" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#D8B4FE" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#D8B4FE" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1A1230" stroke-width="1"/>
  </pattern>
  <clipPath id="card"><rect x="1" y="1" width="998" height="278" rx="18"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1000" height="280" fill="#0B0714"/>
  <rect width="1000" height="280" fill="url(#grid)" opacity="0.6"/>
  <rect x="-190" y="0" width="190" height="280" fill="url(#beam)" opacity="0.5">
    <animate attributeName="x" values="-190;1000" dur="7s" repeatCount="indefinite"/>
  </rect>
  <g font-family="Georgia,DejaVu Serif,serif">
    <g opacity="0">
      <text x="70" y="118" font-size="36" font-weight="bold" fill="#A78BFA">8</text>
      <text x="70" y="140" font-size="12" fill="#8C82B6">contributions, this turn of the sun</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.13;0.95;1" dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 14;0 14;0 0;0 0;0 14" keyTimes="0;0.05;0.13;0.95;1" dur="10s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <text x="290" y="118" font-size="36" font-weight="bold" fill="#A78BFA">1</text>
      <text x="290" y="140" font-size="12" fill="#8C82B6">public repositories</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.10;0.18;0.95;1" dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 14;0 14;0 0;0 0;0 14" keyTimes="0;0.10;0.18;0.95;1" dur="10s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <text x="70" y="216" font-size="36" font-weight="bold" fill="#A78BFA">0</text>
      <text x="70" y="238" font-size="12" fill="#8C82B6">stars collected</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.23;0.95;1" dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 14;0 14;0 0;0 0;0 14" keyTimes="0;0.15;0.23;0.95;1" dur="10s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <text x="290" y="216" font-size="36" font-weight="bold" fill="#A78BFA">0</text>
      <text x="290" y="238" font-size="12" fill="#8C82B6">fellow travellers</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.20;0.28;0.95;1" dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 14;0 14;0 0;0 0;0 14" keyTimes="0;0.20;0.28;0.95;1" dur="10s" repeatCount="indefinite"/>
    </g>
    <text x="70" y="66" font-size="13" letter-spacing="2.5" fill="#CFC7EE">the ledger</text>
    <line x1="520" y1="50" x2="520" y2="250" stroke="#241A3C" stroke-width="1"/>
    <text x="570" y="66" font-size="13" letter-spacing="2.5" fill="#CFC7EE">tongues spoken</text>
    <g>
      <text x="570" y="108" font-size="12.5" fill="#CFC7EE">Python</text>
      <rect x="700" y="96" width="200" height="9" rx="4.5" fill="#241A3C"/>
      <rect x="700" y="96" width="0" height="9" rx="4.5" fill="#3572A5">
        <animate attributeName="width" values="0;0;200;200;0" keyTimes="0;0.10;0.24;0.95;1" dur="10s" repeatCount="indefinite"/>
      </rect>
      <text x="916" y="108" font-size="12" fill="#8C82B6">100.0%</text>
    </g>
  </g>
</g>
<rect x="1" y="1" width="998" height="278" rx="18" fill="none" stroke="url(#edge)" stroke-width="1.4" opacity="0.75"/>
